# src/main/resources/application.yml
# Profil par défaut = local. En production : SPRING_PROFILES_ACTIVE=prod

spring:
  application:
    name: backend_portfolio
  profiles:
    default: local

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/portfolio}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    hikari:
      maximum-pool-size: 5        # petit pool pour les offres gratuites
      minimum-idle: 1
      connection-timeout: 20000

#  sql:
#    init:
#      mode: always                # exécute schema.sql au démarrage (sans Flyway)
#      schema-locations: classpath:schema.sql
#      encoding: UTF-8

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update          # vérifie que les entités collent au schéma SQL
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8089}              # Render/Koyeb fournissent PORT
  compression:
    enabled: true
  error:
    include-message: always
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html

# Paramètres applicatifs (lus plus tard via @ConfigurationProperties)
app:
  jwt:
    secret: ${JWT_SECRET:JRIrEApThsp2Rgi9ad9QhPGdR7/aVay+Ziku1ukNMk4=}   # min. 32 caractères
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  admin:
    email: ${ADMIN_EMAIL:admin@portfolio.local}
    password: ${ADMIN_PASSWORD:ChangeMe123!}    # crée l'admin au 1er démarrage
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  markets:
    default: AFRICA
    default-lang: fr

logging:
  level:
    root: INFO
    gerard.meli.backend_portfolio: DEBUG
    org.springframework.security: ${LOG_LEVEL_SECURITY:DEBUG}

---
# ===================== LOCAL =====================
spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: true

---
# ===================== PRODUCTION =====================
# Variables obligatoires : DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET,
# ADMIN_EMAIL, ADMIN_PASSWORD, CORS_ALLOWED_ORIGINS
# Neon/Supabase : DB_URL=jdbc:postgresql://HOTE/BASE?sslmode=require
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false

logging:
  level:
    root: WARN
    gerard.meli.backend_portfolio: INFO